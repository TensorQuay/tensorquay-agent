name: Bug report
description: Something in TensorQuay Agent doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Issues are public: leave out keys, passwords, tokens and private data, in logs and
        screenshots too. A security problem goes to the security policy instead, never to an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (for example 17.1) or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Sandbox backend
      options:
        - docker
        - firecracker
        - Not sure
  - type: input
    id: host
    attributes:
      label: Host
      description: Operating system and Docker version; the GPU if it matters.
  - type: input
    id: model
    attributes:
      label: Model and server
      description: The model and what serves it (vLLM, SGLang, TensorQuay Engine or a hosted provider's protocol).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines that show the problem, with secrets removed.
      render: text
