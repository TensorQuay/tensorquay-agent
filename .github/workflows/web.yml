name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", "brand/**", "docs/admin-guide/**", "docs/user-guide/**", "crates/tqa-types/schema/**", "crates/tqa-gateway/openapi.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "brand/**", "docs/admin-guide/**", "docs/user-guide/**", "crates/tqa-types/schema/**", "crates/tqa-gateway/openapi.json", ".github/workflows/web.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    # On a 2-core runner the checks take about 13 minutes and the browser suite 25 to 31, more on a slow day: a
    # 45-minute limit cut one run at its last test.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - name: Verify Node version
        run: |
          node --version
          node --input-type=module -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 13)) {
              console.error("Node 22.13 or newer is required.");
              process.exit(1);
            }
          '
      - run: npm install --global corepack@0.32.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run check
        # ESLint over the whole interface needs more than Node's default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: corepack pnpm exec playwright install --with-deps chromium
      # The interface names these Linux faces for Thai, Tamil, Chinese, Japanese and Korean (fonts.spec.ts checks them).
      - name: Install the fonts the interface lists for Linux
        run: sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-noto-cjk
      - run: corepack pnpm run test:e2e
      # The UX pass's 120 pictures (WEB-E2E-143), kept for the release review (docs/release.md, The UX review); only
      # those, for 7 days, and also when the suite fails, so a failing screen's picture can be read.
      - name: Keep the UX pass's pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-pass
          path: web/test-results/ux-pass/
          retention-days: 7
          if-no-files-found: warn
