name: Release images

# The prebuilt images a release offers (deploy/pull-images.sh, deploy/README.md step 0): the gateway, the web app and
# the three runtimes (Minimal, Workstation, Desktop). Each architecture builds natively on its own runner, exactly as
# tools/release/release.py builds them (a clean checkout, SOURCE_DATE_EPOCH at the commit's time); the release image
# checks that need no Firecracker artefacts run on them; and deploy/pull-images.sh pulls them back from a registry on
# the runner (REL-I-006). Only a release tag (vX.Y.Z) publishes: each architecture's images go to ghcr.io/tensorquay,
# then one index per image joins amd64 and arm64 under the version.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/images.yml
      - deploy/pull-images.sh
      - deploy/tests/test_pull_images.py
  workflow_dispatch:
    inputs:
      join_version:
        description: "Join again the amd64 and arm64 images of a published version (for example 18.2.0) under its version; builds nothing"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/tensorquay
  # One name per published image: the local tag the build gives it, then the published repository's name.
  IMAGES: >-
    gateway=tqa-gateway:@ web=tqa-web:@ runtime=tqa-runtime:base-@ workstation=tqa-runtime:workstation-@
    desktop=tqa-runtime:desktop-@ fake-model=tqa-fake-model:@

jobs:
  build:
    name: build (${{ matrix.arch }})
    # A join of a published version (workflow_dispatch with join_version) builds nothing.
    if: github.event_name != 'workflow_dispatch' || inputs.join_version == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # the publish step only, on a release tag
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free the runner's disk for the builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/lib/jvm /opt/az
          docker image prune --all --force > /dev/null
          df -h /
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci.${GITHUB_SHA::12}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the images as the release pipeline does
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          build() {
            local tag="$1"
            shift
            echo "== $(date +%T) $tag"
            docker build -q --build-arg "SOURCE_DATE_EPOCH=$epoch" -t "$tag" "$@" .
          }
          build "tqa-gateway:$VERSION" -f images/gateway/Dockerfile
          build "tqa-web:$VERSION" -f images/web/Dockerfile
          for target in base workstation desktop; do
            build "tqa-runtime:$target-$VERSION" -f images/runtime/Dockerfile --target "$target"
          done
          # The scripted test model, published too so a first try without a model server builds nothing (REL-U-014).
          build "tqa-fake-model:$VERSION" -f images/fake-model/Dockerfile
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep -F -- "$VERSION"
          df -h /
      - name: Check each image's architecture and each runtime's protocol revision
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "tools/release")
          import release_manifest
          revision = str(release_manifest.protocol_revision("."))
          version, arch = os.environ["VERSION"], os.environ["ARCH"]
          for entry in os.environ["IMAGES"].split():
              name, tag = entry.split("=")
              tag = tag.replace("@", version)
              record = json.loads(subprocess.run(["docker", "image", "inspect", tag], capture_output=True,
                                                 text=True, check=True).stdout)[0]
              assert record["Architecture"] == arch, (tag, record["Architecture"])
              labels = record.get("Config", {}).get("Labels") or {}
              if tag.startswith("tqa-runtime:"):
                  assert labels.get("org.tensorquay.protocol-revision") == revision, (tag, labels, revision)
              print(tag, record["Architecture"], "ok")
          PY
      - name: Run the release image checks that need no Firecracker artefacts (REL-I-003, REL-I-004, REL-I-005)
        working-directory: tools/release
        env:
          TQA_DOCKER_TESTS: "1"
        run: |
          TQA_IMAGE_TAG="$VERSION" python3 -m unittest -v test_images.ImageHardening test_images.DesktopInputTool \
            test_images.DesktopBrowserPolicy test_images.ImageFonts
      - name: Pull them back through deploy/pull-images.sh from a registry on the runner (REL-I-006)
        run: |
          set -euo pipefail
          docker run -d --name registry -p 127.0.0.1:5000:5000 \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in $(seq 30); do curl -fsS http://127.0.0.1:5000/v2/ > /dev/null && break; sleep 1; done
          mirror=localhost:5000/tensorquay
          for entry in $IMAGES; do
            name="${entry%%=*}"
            tag="${entry#*=}"
            tag="${tag//@/$VERSION}"
            docker tag "$tag" "$mirror/tensorquay-agent-$name:$VERSION"
            docker push --quiet "$mirror/tensorquay-agent-$name:$VERSION"
            docker rmi "$mirror/tensorquay-agent-$name:$VERSION" > /dev/null
          done
          TQA_IMAGE_REGISTRY="$mirror" deploy/pull-images.sh --desktop --fake-model "$VERSION" | tee pulled.txt
          eval "$(grep '^export ' pulled.txt)"
          id() { docker image inspect --format '{{.Id}}' "$1"; }
          test "$(id "$TQA_GATEWAY_IMAGE")" = "$(id "tqa-gateway:$VERSION")"
          test "$(id "$TQA_WEB_IMAGE")" = "$(id "tqa-web:$VERSION")"
          test "$TQA_RUNTIME_IMAGE" = "$(id "tqa-runtime:base-$VERSION")"
          for target in minimal workstation desktop; do
            built="$target"
            [ "$target" = minimal ] && built=base
            test "$(id "tqa-runtime:$target")" = "$(id "tqa-runtime:$built-$VERSION")"
          done
          test "$(id tqa-fake-model:local)" = "$(id "tqa-fake-model:$VERSION")"
          case "$TQA_GATEWAY_IMAGE" in "$mirror/tensorquay-agent-gateway@sha256:"*) ;; *) exit 1 ;; esac
          echo "pulled back by digest: every image is the one built"
      - name: Publish this architecture's images (a release tag only)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for entry in $IMAGES; do
            name="${entry%%=*}"
            tag="${entry#*=}"
            tag="${tag//@/$VERSION}"
            docker tag "$tag" "$REGISTRY/tensorquay-agent-$name:$VERSION-$ARCH"
            docker push --quiet "$REGISTRY/tensorquay-agent-$name:$VERSION-$ARCH"
          done
          docker logout ghcr.io

  publish:
    name: publish (one index per image)
    needs: build
    # A release tag, once both architectures are built and pushed; or a join asked for by hand, of a version whose
    # architecture images are in the registry already (18.2.0: the join failed on the runner's updated Docker).
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref_type == 'tag' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.join_version != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Join amd64 and arm64 under the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.join_version || github.ref_name }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tools/release/join-images.sh "$VERSION"
          docker logout ghcr.io
