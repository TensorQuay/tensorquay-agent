name: Docker sandbox contracts

on:
  push:
    branches: [main]
    paths:
      - crates/tqa-sandbox/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - crates/tqa-sandbox/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-sandbox-rust-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Install pinned test runner
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-nextest@0.9.145
      - name: Run sandbox contracts against Docker Engine
        # Left to the jobs and hosts that have what they need: the Firecracker suites and SBX-F-014's ruleset case
        # need KVM and the Firecracker host image (images/vmm), so the KVM gate runs them (G-13, tools/check.sh
        # --kvm); the tests that start a runtime image run in runtime.yml once it has built both images;
        # workspace_clone runs in gateway.yml; egress needs a pinned gateway image as well; manual_daemon restarts
        # Docker Desktop and is run by hand.
        env:
          TQA_DOCKER_TESTS: "1"
        # The ephemeral runner can assign credential-file ownership to sandbox uid 1000.
        run: |
          skip='binary(firecracker_contract) | binary(firecracker_density) | binary(firecracker_guest)'
          skip+=' | binary(firecracker_kvm) | test(sbx_f_014_ruleset_loads_in_the_vm_host_image)'
          skip+=' | binary(runtime_image) | binary(runtime_recovery) | binary(runtime_posture) | binary(template_files)'
          skip+=' | test(sec_010_a_process_storm_stops_at_the_pids_limit) | test(sbx_c_023_a_sandbox_reaches_its_own_loopback)'
          skip+=' | binary(workspace_clone) | binary(egress) | binary(manual_daemon)'
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            TQA_DOCKER_TESTS=1 cargo nextest run -p tqa-sandbox --run-ignored all --no-fail-fast -E "not ($skip)"
