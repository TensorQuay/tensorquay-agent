name: Gateway contracts

on:
  push:
    branches: [main]
    paths:
      - crates/tqa-gateway/**
      - crates/tqa-types/**
      - crates/tqa-llm/**
      - crates/tqa-sandbox/**
      - crates/tqa-runtime/**
      - crates/tqa-core/**
      - crates/tqa-context/**
      - crates/tqa-prompt/**
      - crates/tqa-tools/**
      - crates/tqa-testkit/**
      - deploy/**
      - images/gateway/**
      - images/web/**
      - images/runtime/**
      - images/fake-model/**
      - web/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/gateway.yml
  pull_request:
    paths:
      - crates/tqa-gateway/**
      - crates/tqa-types/**
      - crates/tqa-llm/**
      - crates/tqa-sandbox/**
      - crates/tqa-runtime/**
      - crates/tqa-core/**
      - crates/tqa-context/**
      - crates/tqa-prompt/**
      - crates/tqa-tools/**
      - crates/tqa-testkit/**
      - deploy/**
      - images/gateway/**
      - images/web/**
      - images/runtime/**
      - images/fake-model/**
      - web/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/gateway.yml

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    # A 2-core runner builds three images and the coverage report after the contracts: on 7 Nov the job took 97 minutes
    # to the contracts' end, and the browser suites and the instrumented rerun of every contract come after.
    timeout-minutes: 300
    # The runner's disk holds the build without debug information (tests and coverage don't need it).
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # A 2-core runner is slower than a workstation: the harness scales its deadlines, as tools/check.sh does.
      TQA_TEST_DEADLINE_SCALE: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free the runner's disk for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/lib/jvm /opt/az
          docker image prune --all --force > /dev/null
          df -h / /mnt 2>/dev/null || df -h /
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-gateway-rust-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Install pinned test and coverage tools
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-nextest@0.9.145,cargo-llvm-cov@0.9.1
      - name: Create ephemeral database credentials
        shell: bash
        run: |
          set -euo pipefail
          database_password="$(openssl rand -hex 32)"
          gateway_docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          echo "::add-mask::$database_password"
          {
            printf 'TQA_POSTGRES_PASSWORD=%s\n' "$database_password"
            printf 'TQA_DATABASE_URL=postgres://tqa:%s@127.0.0.1:55432/gateway\n' "$database_password"
            printf 'DATABASE_URL=postgres://tqa:%s@127.0.0.1:55432/gateway\n' "$database_password"
            printf 'TQA_DOCKER_GID=%s\n' "$gateway_docker_gid"
          } >> "$GITHUB_ENV"
      - name: Start pinned PostgreSQL
        run: docker compose -f deploy/compose/dev.yml up -d --no-build --wait postgres
      - name: Install SQLx CLI and apply the checked migrations
        run: |
          set -euo pipefail
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
          sqlx migrate run --source crates/tqa-gateway/migrations
      - name: Verify SQL metadata against the live schema
        working-directory: crates/tqa-gateway
        run: cargo sqlx prepare --check -- --all-targets
      - name: Check formatting and offline SQL metadata compilation
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo fmt -p tqa-gateway --check
          cargo clippy -p tqa-gateway --all-targets -- -D warnings
      - name: Build the static gateway image for the Docker contract
        run: docker build -f images/gateway/Dockerfile -t tqa-gateway:local .
      - name: Build the standalone web image for the Docker contract
        run: docker build -f images/web/Dockerfile -t tqa-web:local .
      - name: Build the real runtime and scripted model for the demo
        run: |
          set -euo pipefail
          docker build --target base -f images/runtime/Dockerfile -t tqa-runtime:base .
          docker build --target workstation -f images/runtime/Dockerfile -t tqa-runtime:workstation .
          docker build -f images/fake-model/Dockerfile -t tqa-fake-model:local .
      - name: Name the images under test by their IDs
        # The stack harness refuses bare tags (deploy/tests/compose.py): on a shared engine a tag may name another
        # build. Every later step gets the IDs; a step that sets one itself keeps its own.
        run: |
          set -euo pipefail
          image() { docker image inspect --format '{{.Id}}' "$1"; }
          {
            printf 'TQA_GATEWAY_IMAGE=%s\n' "$(image tqa-gateway:local)"
            printf 'TQA_WEB_IMAGE=%s\n' "$(image tqa-web:local)"
            printf 'TQA_RUNTIME_IMAGE=%s\n' "$(image tqa-runtime:base)"
            printf 'TQA_WORKSTATION_IMAGE=%s\n' "$(image tqa-runtime:workstation)"
            printf 'TQA_FAKE_MODEL_IMAGE=%s\n' "$(image tqa-fake-model:local)"
          } >> "$GITHUB_ENV"
      - name: Check repository cloning through the policy proxy
        env:
          SQLX_OFFLINE: "true"
          TQA_DOCKER_TESTS: "1"
          TQA_RUNTIME_TEST_IMAGE: tqa-runtime:workstation
        run: |
          set -euo pipefail
          docker build --target clone-probe -f images/runtime/Dockerfile -t tqa-runtime:clone-probe .
          export TQA_CLONE_PROBE_IMAGE="$(docker image inspect --format '{{.Id}}' tqa-runtime:clone-probe)"
          cargo nextest run -p tqa-sandbox --test workspace_clone --run-ignored all --retries 0
      - name: Install the pinned browser test tools
        working-directory: web
        run: |
          set -euo pipefail
          npm install --global corepack@0.36.0
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium
      - name: Run all gateway contracts against PostgreSQL
        env:
          SQLX_OFFLINE: "true"
          TQA_DOCKER_TESTS: "1"
          TQA_GATEWAY_IMAGE: tqa-gateway:local
        # Every failure in one run, the database-independent contracts included (`--run-ignored all` runs both, so they
        # have no step of their own since 14 Nov 2026). PERF-002 and PERF-003 measure a release
        # build and refuse this debug one; a shared 2-core runner's timings would measure the runner anyway.
        run: cargo nextest run -p tqa-gateway --run-ignored all --no-fail-fast -E 'not test(/^perf_/)'
      - name: Test the deployment harness failures without Docker
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Run the full-stack browser and workspace contract
        env:
          TQA_DOCKER_TESTS: "1"
          TQA_WEB_EVIDENCE_DIR: ${{ runner.temp }}/tqa-demo-evidence
        run: python3 deploy/tests/demo.py
      - name: Run full-stack UX invariants
        env:
          TQA_DOCKER_TESTS: "1"
          TQA_WEB_EVIDENCE_DIR: ${{ runner.temp }}/tqa-ux-evidence
        run: python3 deploy/tests/demo.py --suite ux
      - name: Run the environment switch contract
        env:
          TQA_DOCKER_TESTS: "1"
          TQA_WEB_EVIDENCE_DIR: ${{ runner.temp }}/tqa-environment-evidence
        run: python3 deploy/tests/demo.py --suite environment
      - name: Prove explicitly selected database tests fail without opt-in
        shell: bash
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          if env -u TQA_DATABASE_URL cargo nextest run -p tqa-gateway --run-ignored all \
            -E 'test(gw_i_016_migrations_preserve_data_when_reapplied)' > missing-database.log 2>&1; then
            cat missing-database.log
            exit 1
          fi
          grep -F 'PostgreSQL tests require TQA_DATABASE_URL' missing-database.log
      - name: Prove explicitly selected Docker tests fail without opt-in
        shell: bash
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          if env -u TQA_DOCKER_TESTS cargo nextest run -p tqa-gateway --test compose --run-ignored all > missing-docker.log 2>&1; then
            cat missing-docker.log
            exit 1
          fi
          grep -F 'Docker tests require TQA_DOCKER_TESTS=1' missing-docker.log
      - name: Check crate documentation
        env:
          SQLX_OFFLINE: "true"
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p tqa-gateway --no-deps
      # Coverage runs on main only (14 Nov 2026, the owner: a pull request waited 90 minutes): the instrumented rerun of
      # every contract took 27 of them, and the plain run above already decides a pull request.
      - name: Free the disk for the coverage build
        if: github.event_name == 'push'
        # The runner had 14 GB left here on 7 Nov and the instrumented build's linker died of it (ld: Bus error). The
        # debug test build goes (its tests are done; the cache saves whatever is rebuilt), and so do the image build
        # layers; the images under test stay (the instrumented contracts run them with --no-build).
        run: |
          rm -rf target/debug
          docker builder prune -af > /dev/null
          df -h /
      - name: Report crate coverage
        if: github.event_name == 'push'
        env:
          SQLX_OFFLINE: "true"
          TQA_DOCKER_TESTS: "1"
          TQA_GATEWAY_IMAGE: tqa-gateway:local
        # The same contracts as above, instrumented (the release-only PERF tests left out as there). The coverage
        # build goes once the report is printed.
        run: |
          cargo llvm-cov nextest -p tqa-gateway --run-ignored all --no-fail-fast -E 'not test(/^perf_/)'
          rm -rf target/llvm-cov-target
      - name: Stop the ephemeral database
        if: always()
        run: docker compose -f deploy/compose/dev.yml down --volumes
