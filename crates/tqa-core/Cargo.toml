[package]
name = "tqa-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The host-agnostic agent loop, executors, budgets, recovery and event emission."

[dependencies]
async-trait = "0.1.89"
futures = "0.3.32"
serde_json = "1.0.149"
sha2 = "~0.11"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tqa-types = { version = "0.1.0", path = "../tqa-types" }
tqa-llm = { version = "0.1.0", path = "../tqa-llm" }
tqa-context = { version = "0.1.0", path = "../tqa-context" }
tqa-tools = { version = "0.1.0", path = "../tqa-tools" }
tqa-prompt = { version = "0.1.0", path = "../tqa-prompt" }

[dev-dependencies]
tqa-testkit = { version = "0.1.0", path = "../tqa-testkit" }
tempfile = "3.27.0"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }

[lints]
workspace = true
