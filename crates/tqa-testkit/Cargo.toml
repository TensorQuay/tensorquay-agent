[package]
name = "tqa-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Test-only fakes, fixtures, model server and protocol client for tests and benchmarks."

[dependencies]
tqa-types = { version = "0.1.0", path = "../tqa-types" }
tqa-llm = { version = "0.1.0", path = "../tqa-llm" }
tqa-context = { version = "0.1.0", path = "../tqa-context" }
tqa-tools = { version = "0.1.0", path = "../tqa-tools" }
tqa-prompt = { version = "0.1.0", path = "../tqa-prompt" }
axum = { version = "~0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "~1.53", features = ["rt", "time", "sync", "macros", "net", "signal", "process", "io-util", "io-std"] }
tokio-util = { version = "~0.7", features = ["rt"] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
sha2 = "~0.11"
futures = "~0.3"
bytes = "~1.12"

tempfile = "~3.27"
toml = "~1.1"
async-trait = "~0.1"
reqwest = { version = "~0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[dev-dependencies]
tokio-test = "~0.4"
tokio-tungstenite = { version = "~0.29", default-features = false, features = ["connect"] }

[lints]
workspace = true
