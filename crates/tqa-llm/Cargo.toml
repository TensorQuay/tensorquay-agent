[package]
name = "tqa-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Model provider contracts, streaming adapters, retries and the model registry."

[dependencies]
tqa-types = { version = "0.1.0", path = "../tqa-types" }
tokio = { version = "~1.53", features = ["rt", "time", "sync", "macros", "net"] }
tokio-util = { version = "~0.7", features = ["rt"] }
futures = "~0.3"
bytes = "~1.12"
reqwest = { version = "~0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
hyper = { version = "~1.11", default-features = false }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
toml = "~1.1"
thiserror = "~2.0"
tracing = "~0.1"
async-trait = "~0.1"
rand = "~0.9"
secrecy = "~0.10"
url = "~2.5"
base64 = "~0.22"

[dev-dependencies]
tqa-testkit = { version = "0.1.0", path = "../tqa-testkit" }
proptest = "~1.11"
tokio-test = "~0.4"

[lints]
workspace = true
