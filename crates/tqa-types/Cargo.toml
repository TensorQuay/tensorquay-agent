[package]
name = "tqa-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Wire protocol frames, event types, JSON Schemas, identifiers and error codes."

[dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
schemars = { version = "~1.2", features = ["derive"] }
thiserror = "~2.0"

[dev-dependencies]
proptest = "~1.11"
jsonschema = { version = "~0.57", default-features = false }

[lints]
workspace = true
