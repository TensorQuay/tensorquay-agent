[package]
name = "tqa-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tool contracts, validation, workspace policy, process management and permissions."

[dependencies]
tqa-types = { version = "0.1.0", path = "../tqa-types" }
thiserror = "~2.0"
tokio = { version = "~1.53", features = ["process", "fs", "io-util", "rt", "sync", "time", "macros", "net"] }
tokio-util = { version = "~0.7", features = ["rt"] }
async-trait = "~0.1"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
jsonschema = { version = "~0.57", default-features = false }
globset = { version = "~0.4", default-features = false }
tracing = "~0.1"
nix = { version = "~0.31", features = ["fs", "process", "signal"] }
base64 = "~0.22"
memchr = "~2.8"
sha2 = "~0.11"
rustix = { version = "~1.1", features = ["fs"] }
ignore = "~0.4"
grep-searcher = "~0.1"
grep-regex = "~0.1"
grep-matcher = "~0.1"
bytes = "~1.12"
hyper = { version = "~1.11", features = ["client", "http1"] }
hyper-util = { version = "~0.1", features = ["tokio"] }
http-body-util = "~0.1"
tokio-rustls = { version = "~0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "~1.0"
url = "~2.5"
secrecy = "~0.10"
html2text = { version = "=0.17.1", default-features = false }
# The computer tool's browser driver (ADR-0039): plain ws:// to the browser's loopback debugging port, so no TLS.
tokio-tungstenite = { version = "~0.29", default-features = false, features = ["connect"] }
futures = "~0.3"
# Screenshots' PNG (ADR-0039 slice 3); already in the tree through flate2.
miniz_oxide = "0.9"
# The computer tool's accessibility path (ADR-0039 slice 2, amended 18 Oct 2026): AT-SPI over the session's
# accessibility bus through our own proxies, in pure Rust, with tokio. zbus 6 holds the names and wire format that
# zbus 5 took from three crates now unmaintained (ADR-0017 point 10).
zbus = { version = "~6.0", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
tqa-testkit = { version = "0.1.0", path = "../tqa-testkit" }
tempfile = "~3.27"
proptest = "~1.11"

[lints]
workspace = true
