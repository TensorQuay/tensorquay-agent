[package]
name = "tqa-prompt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "System prompt assembly, instruction discovery, skills and tool-call fallback grammar."

[dependencies]
tqa-types = { version = "0.1.0", path = "../tqa-types" }
tqa-tools = { version = "0.1.0", path = "../tqa-tools" }
tqa-context = { version = "0.1.0", path = "../tqa-context" }
thiserror = "~2.0"
serde_json = "~1.0"
async-trait = "~0.1"
tokio = { version = "~1.53", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "~3.27"
proptest = "~1.11"
tokio = { version = "~1.53", features = ["rt", "macros", "time"] }
tokio-util = "~0.7"
tqa-testkit = { version = "0.1.0", path = "../tqa-testkit" }

[lints]
workspace = true
