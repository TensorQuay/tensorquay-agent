# Gate dependency advisories, licences, duplicate versions and sources.
# Additions to this policy require a decision record.

[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "Unlicense",
    # ADR-0017: MPL-2.0 is allowed only as an unmodified dependency; never patch or vendor MPL files.
    "MPL-2.0",
    # ADR-0017 item 3: permissive data licence used by the Mozilla CA root bundle (webpki-roots).
    "CDLA-Permissive-2.0",
]
private = { ignore = false }
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
