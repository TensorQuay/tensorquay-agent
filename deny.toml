# Gate dependency advisories, licences, duplicate versions and sources.
# Additions to this policy require a decision record.

[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
# ADR-0017 point 9, amended 17 Nov 2026 (the Product Owner's decision): chrono is unmaintained, an informational
# advisory with no flaw and no patched release. Only oxidize-pdf and rmcp use it, never our crates (G-05-chrono);
# the ignore goes when both have dropped it. Any other advisory against chrono still fails G-05.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; only through oxidize-pdf and rmcp (ADR-0017 point 9)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "Unlicense",
    # ADR-0017: MPL-2.0 is allowed only as an unmodified dependency; never patch or vendor MPL files.
    "MPL-2.0",
    # ADR-0017 item 3: permissive data licence used by the Mozilla CA root bundle (webpki-roots).
    "CDLA-Permissive-2.0",
]
private = { ignore = false }
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
