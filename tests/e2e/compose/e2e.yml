# TK-I-001: the E2E task set against the scripted model. tests/e2e/dry_run.py rewrites the scenario file for each
# task and variant, then restarts only this service.
services:
  gateway:
    depends_on:
      fake-model:
        condition: service_healthy
  fake-model:
    image: ${TQA_FAKE_MODEL_IMAGE:-tqa-fake-model:local}
    command: ["--scenario", "/scenarios/current.json"]
    user: "1000:1000"
    networks: [control]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16777216,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - type: bind
        source: ${TQA_E2E_SCENARIO:?Set the scenario file the fake model serves}
        target: /scenarios/current.json
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, --header, "Authorization: Bearer healthcheck", "http://127.0.0.1:8080/v1/models"]
      interval: 2s
      timeout: 3s
      retries: 15
