experimental = ["setup-scripts"]

[scripts.setup.prime-model]
command = ["python3", "-B", "crates/tqa-testkit/scripts/prime_model.py"]
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "5s" }
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "macos")' }
filter = 'package(=tqa-testkit) and binary(=standalone)'
setup = 'prime-model'

# Every run records each test's outcome, so a failure is named on disk even when its console output was not kept
# (target/nextest/<profile>/junit.xml; target/ is ignored).
[profile.default.junit]
path = "junit.xml"
