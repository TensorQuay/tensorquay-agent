name: tqa-development

services:
  postgres:
    # PostgreSQL 18.6, multi-platform image index.
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: tqa
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${TQA_POSTGRES_PASSWORD:?Set a development database password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tqa -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

volumes:
  postgres:
